<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multistream</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="card login-card">
      <h1>Multistream</h1>
      <p class="muted">Ingresá la contraseña del panel</p>
      <input id="login-password" type="password" placeholder="Contraseña" />
      <button id="login-btn">Entrar</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <header>
      <h1>Multistream</h1>
      <button id="logout-btn" class="ghost">Salir</button>
    </header>

    <section class="card">
      <h2>Estado</h2>
      <div id="status-box">Cargando…</div>
      <div class="actions">
        <button id="refresh-status-btn" class="ghost">Actualizar</button>
        <button id="restart-relay-btn">Aplicar destinos / reiniciar envío</button>
        <button id="stop-relay-btn" class="danger">Detener envío</button>
      </div>
    </section>

    <section class="card">
      <h2>Datos para OBS</h2>
      <div id="connection-info">Cargando…</div>
    </section>

    <section class="card">
      <h2>Destinos</h2>
      <div id="destinations-list"></div>

      <h3>Agregar destino</h3>
      <form id="dest-form">
        <label>Plataforma
          <select name="platform" id="dest-platform">
            <option value="youtube">YouTube</option>
            <option value="twitch">Twitch</option>
            <option value="kick">Kick</option>
            <option value="tiktok">TikTok</option>
            <option value="facebook">Facebook</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label>Nombre <input type="text" name="name" placeholder="Ej: YouTube principal" /></label>
        <label>URL RTMP base <input type="text" name="url" placeholder="rtmp://a.rtmp.youtube.com/live2" required /></label>
        <label>Stream key <input type="text" name="streamKey" placeholder="clave de la plataforma" /></label>
        <label class="checkbox"><input type="checkbox" name="enabled" checked /> Habilitado</label>
        <button type="submit">Agregar destino</button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
